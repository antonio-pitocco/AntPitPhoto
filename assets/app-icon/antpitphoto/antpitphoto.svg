<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- AntPitPhoto: a print for the wall. The sheet keeps a paper border, heavier at the bottom
       (the exhibition mat), in the 3:2 frame of the camera, with the pencil mark where the photographer signs. The picture is
       the AntPitLab idea "the shadows glow, the light dissolves": lavender light fading at the top,
       an amber glow rising out of the dark at the bottom. Original artwork for AntPitPhoto. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1820"/>
      <stop offset="1" stop-color="#0b0a0d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2ea"/>
      <stop offset="1" stop-color="#e9e3d8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d0f4"/>
      <stop offset="0.22" stop-color="#9c8ad0"/>
      <stop offset="0.5" stop-color="#2a2236"/>
      <stop offset="1" stop-color="#120e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.75" fx="0.5" fy="1.0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.28" stop-color="#ff9f2e" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#b8560f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3a1a08" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="pic"><rect x="112" y="154" width="288" height="192"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- the sheet, lifted off the wall -->
  <rect x="88" y="138" width="336" height="250" fill="#000" opacity="0.55" filter="url(#shadow)" transform="translate(0 8)"/>
  <rect x="88" y="130" width="336" height="252" fill="url(#paper)"/>
  <!-- the picture -->
  <g clip-path="url(#pic)">
    <rect x="112" y="154" width="288" height="192" fill="url(#sky)"/>
    <rect x="112" y="154" width="288" height="192" fill="url(#glow)"/>
  </g>
  <!-- the signature, in pencil, on the bottom mat -->
  <path d="M348 365 C 356 361, 362 367, 370 363 S 382 362, 388 364" fill="none" stroke="#9a948a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
